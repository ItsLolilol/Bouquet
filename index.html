<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>For You</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #000000;
      overflow: hidden;
      font-family: "JetBrains Mono", "Fira Code", "SF Mono", "Cascadia Code", Consolas, "Courier New", monospace;
    }

    #scene {
      display: block;
      width: 100vw;
      height: 100dvh;
      touch-action: none;
      cursor: grab;
    }

    #scene:active {
      cursor: grabbing;
    }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>

  <script>
    (() => {
      const canvas = document.getElementById("scene");
      const ctx = canvas.getContext("2d", { alpha: false });

      // Message affiché en ASCII en bas du bouquet
      const MESSAGE = "I love you sweetheart <3";

      // Palette de densité ASCII (du sombre au lumineux)
      const RAMP = " .,:;-=+*#%@";
      const RAMP_CODES = Uint8Array.from(RAMP, (c) => c.charCodeAt(0));
      const CHAR_LUT = Array.from({ length: 128 }, (_, i) => String.fromCharCode(i));

      // Palette harmonieuse romantique & contrastée sur fond noir
      const COLORS = {
        lilyWhite:   [252, 249, 255],
        lilyThroat:  [224, 242, 198],
        lilyBlush:   [255, 192, 220],
        lilySpeck:   [236, 118, 162],
        stamenStem:  [235, 242, 215],
        antherGold:  [255, 192, 55],
        antherAmber: [232, 125, 38],

        crimsonCore: [115, 12, 34],
        crimsonMid:  [215, 28, 62],
        crimsonEdge: [255, 86, 118],

        pinkCore:    [175, 42, 92],
        pinkMid:     [245, 108, 162],
        pinkEdge:    [255, 196, 224],

        champCore:   [198, 128, 96],
        champMid:    [248, 196, 162],
        champEdge:   [255, 236, 218],

        lilacDeep:   [145, 86, 210],
        lilacSoft:   [214, 165, 255],

        leafDark:    [24, 108, 58],
        leafMid:     [44, 162, 88],
        leafLight:   [78, 212, 124],

        wrapPearl:   [234, 230, 240],
        wrapSoft:    [200, 196, 212],
        wrapShadow:  [158, 156, 174],
        wrapInner:   [130, 126, 144],

        ribbonMain:  [248, 56, 114],
        ribbonDeep:  [182, 26, 74],
        whitePure:   [255, 255, 255]
      };

      // ==========================================
      // Utilitaires mathématiques 3D
      // ==========================================
      function normalize(v) {
        const len = Math.hypot(v[0], v[1], v[2]) || 1;
        return [v[0] / len, v[1] / len, v[2] / len];
      }

      function cross(a, b) {
        return [
          a[1] * b[2] - a[2] * b[1],
          a[2] * b[0] - a[0] * b[2],
          a[0] * b[1] - a[1] * b[0]
        ];
      }

      function basisFromDir(dir) {
        const up = normalize(dir);
        const helper = Math.abs(up[1]) < 0.9 ? [0, 1, 0] : [1, 0, 0];
        const right = normalize(cross(helper, up));
        const forward = normalize(cross(up, right));
        return { right, up, forward };
      }

      function mixColor(c1, c2, t) {
        const k = Math.max(0, Math.min(1, t));
        return [
          c1[0] + (c2[0] - c1[0]) * k,
          c1[1] + (c2[1] - c1[1]) * k,
          c1[2] + (c2[2] - c1[2]) * k
        ];
      }

      function toWorld(cx, cy, cz, basis, lx, ly, lz) {
        return {
          x: cx + basis.right[0] * lx + basis.up[0] * ly + basis.forward[0] * lz,
          y: cy + basis.right[1] * lx + basis.up[1] * ly + basis.forward[1] * lz,
          z: cz + basis.right[2] * lx + basis.up[2] * ly + basis.forward[2] * lz
        };
      }

      // ==========================================
      // Stockage Géométrie : Maillage 3D + Points d'accent
      // ==========================================
      const mX = [], mY = [], mZ = [];
      const mNX = [], mNY = [], mNZ = [];
      const mR = [], mG = [], mB = [];
      const mTriA = [], mTriB = [], mTriC = [];

      const ptX = [], ptY = [], ptZ = [];
      const ptR = [], ptG = [], ptB = [];
      const ptCh = [];

      function addAccentPoint(x, y, z, col, ch = "*") {
        ptX.push(x); ptY.push(y); ptZ.push(z);
        ptR.push(col[0]); ptG.push(col[1]); ptB.push(col[2]);
        ptCh.push(ch.charCodeAt(0));
      }

      // Générateur générique de surface 3D maillée (100% opaque, zéro trou)
      function addGridMesh(uSteps, vSteps, evalFn, wrapU = false, fallbackNormal = [0, 1, 0]) {
        const colsU = wrapU ? uSteps : uSteps + 1;
        const rowsV = vSteps + 1;
        const baseIdx = mX.length;
        const gridPos = new Array(rowsV * colsU);

        for (let iv = 0; iv < rowsV; iv++) {
          const v = iv / vSteps;
          for (let iu = 0; iu < colsU; iu++) {
            const u = iu / uSteps;
            const res = evalFn(u, v);
            gridPos[iv * colsU + iu] = res;
            mX.push(res.x); mY.push(res.y); mZ.push(res.z);
            mR.push(res.r); mG.push(res.g); mB.push(res.b);
            mNX.push(0); mNY.push(0); mNZ.push(0);
          }
        }

        for (let iv = 0; iv < rowsV; iv++) {
          for (let iu = 0; iu < colsU; iu++) {
            const iuPrev = wrapU ? (iu - 1 + colsU) % colsU : Math.max(0, iu - 1);
            const iuNext = wrapU ? (iu + 1) % colsU : Math.min(colsU - 1, iu + 1);
            const ivPrev = Math.max(0, iv - 1);
            const ivNext = Math.min(rowsV - 1, iv + 1);

            const pL = gridPos[iv * colsU + iuPrev];
            const pR = gridPos[iv * colsU + iuNext];
            const pD = gridPos[ivPrev * colsU + iu];
            const pU = gridPos[ivNext * colsU + iu];

            const tu = [pR.x - pL.x, pR.y - pL.y, pR.z - pL.z];
            const tv = [pU.x - pD.x, pU.y - pD.y, pU.z - pD.z];
            let n = cross(tu, tv);
            const len = Math.hypot(n[0], n[1], n[2]);

            if (len < 1e-5) {
              n = normalize(fallbackNormal);
            } else {
              n = [n[0] / len, n[1] / len, n[2] / len];
            }

            const idx = baseIdx + iv * colsU + iu;
            mNX[idx] = n[0];
            mNY[idx] = n[1];
            mNZ[idx] = n[2];
          }
        }

        for (let iv = 0; iv < vSteps; iv++) {
          for (let iu = 0; iu < uSteps; iu++) {
            const iuNext = wrapU ? (iu + 1) % colsU : iu + 1;
            const i00 = baseIdx + iv * colsU + iu;
            const i10 = baseIdx + iv * colsU + iuNext;
            const i01 = baseIdx + (iv + 1) * colsU + iu;
            const i11 = baseIdx + (iv + 1) * colsU + iuNext;

            mTriA.push(i00, i00);
            mTriB.push(i10, i11);
            mTriC.push(i11, i01);
          }
        }
      }

      // ==========================================
      // 1. VRAIE ROSE SCULPTÉE EN SPIRALE 3D
      //    (Cœur enroulé sombre + pétales galbés à bord recourbé lumineux)
      // ==========================================
      function addRose(cx, cy, cz, dir, radius, coreCol, midCol, edgeCol) {
        const basis = basisFromDir(dir);
        const totalPetals = 20;
        const goldenAngle = 2.3999632; // 137.5° : spirale botanique réelle

        // Calice vert discret sous la rose
        addGridMesh(10, 2, (u, v) => {
          const a = u * Math.PI * 2;
          const r = radius * (0.14 + v * 0.24);
          const ly = -0.14 * radius + v * 0.14 * radius;
          const wp = toWorld(cx, cy, cz, basis, Math.cos(a) * r, ly, Math.sin(a) * r);
          return { x: wp.x, y: wp.y, z: wp.z, r: COLORS.leafDark[0], g: COLORS.leafDark[1], b: COLORS.leafDark[2] };
        }, true, basis.up);

        // 20 pétales distincts en spirale (du cœur serré vers la corolle ouverte)
        for (let i = 0; i < totalPetals; i++) {
          const t = i / (totalPetals - 1); // 0 = cœur, 1 = bord extérieur
          const pAngle = i * goldenAngle;

          // Rayon de base qui s'écarte progressivement en spirale
          const baseR = radius * (0.045 + Math.pow(t, 1.15) * 0.44);
          const petalHeight = radius * (0.52 + 0.34 * Math.sin(t * Math.PI * 0.72));
          // Inclinaison : presque vertical au centre, s'ouvre gracieusement à l'extérieur
          const openTilt = 0.16 + Math.pow(t, 1.35) * 0.88;
          // Ouverture angulaire du pétale (plus large sur l'extérieur)
          const halfArc = 0.62 + t * 0.34;
          // Intensité du rebord recourbé (la "lèvre" typique d'un pétale de rose)
          const recurve = radius * (0.04 + t * 0.24);

          const layerDark = mixColor(coreCol, midCol, t * 0.45);
          const layerBody = mixColor(coreCol, midCol, 0.35 + t * 0.65);
          const layerRim  = mixColor(midCol, edgeCol, 0.40 + t * 0.60);

          addGridMesh(4, 5, (uNorm, v) => {
            const u = uNorm * 2 - 1; // -1 à 1 (largeur du pétale)
            // Profil du pétale de rose : large en haut, légèrement en cœur avec pointe douce au milieu
            const widthProfile = Math.sin(Math.pow(v, 0.58) * Math.PI * 0.88);
            const a = pAngle + u * halfArc * (0.35 + 0.65 * widthProfile);

            // Creux du pétale (bombé vers l'extérieur au milieu, bords pincés)
            const cup = (1 - u * u) * 0.08 * radius * Math.sin(v * Math.PI);
            // Recourbement vers l'extérieur sur le haut du pétale (v > 0.62)
            const lip = v > 0.60 ? Math.pow((v - 0.60) / 0.40, 2.0) * recurve * (0.65 + 0.35 * (1 - u * u)) : 0;
            // Petite pointe centrale recourbée typique de la rose
            const centerLip = Math.pow(v, 3.0) * (1 - u * u) * 0.055 * radius * t;

            const r = baseR + v * petalHeight * Math.sin(openTilt) + cup + lip + centerLip;
            const ly = v * petalHeight * Math.cos(openTilt)
                     - lip * 0.48
                     - t * 0.10 * radius
                     + (1 - u * u) * 0.03 * radius * v;

            const wp = toWorld(cx, cy, cz, basis, Math.cos(a) * r, ly, Math.sin(a) * r);

            // Fort contraste entre le creux sombre et l'arête lumineuse du pétale
            // -> indispensable pour que la spirale de la rose se lise instantanément en ASCII
            let col;
            if (v < 0.42) {
              col = mixColor(layerDark, layerBody, v / 0.42);
            } else if (v < 0.78) {
              col = mixColor(layerBody, layerRim, ((v - 0.42) / 0.36) * 0.55);
            } else {
              col = mixColor(layerBody, layerRim, 0.55 + ((v - 0.78) / 0.22) * 0.45);
            }

            // Occlusion au fond de la rose pour marquer la profondeur entre chaque couche
            const ao = 0.42 + 0.58 * Math.pow(v, 0.72) * (0.72 + 0.28 * t);
            return {
              x: wp.x, y: wp.y, z: wp.z,
              r: Math.min(255, col[0] * ao),
              g: Math.min(255, col[1] * ao),
              b: Math.min(255, col[2] * ao)
            };
          }, false, basis.up);
        }
      }

      // ==========================================
      // 2. FLEUR DE LYS 3D (6 pétales recourbés + étamines dorées)
      // ==========================================
      function addLily(cx, cy, cz, dir, scale, bladeCol, tipCol) {
        const basis = basisFromDir(dir);

        for (let p = 0; p < 6; p++) {
          const isOuter = p % 2 === 1;
          const pAngle = (p / 6) * Math.PI * 2;
          const cosA = Math.cos(pAngle);
          const sinA = Math.sin(pAngle);
          const perpX = -sinA;
          const perpZ = cosA;

          const lengthScale = isOuter ? 1.04 : 0.97;
          const widthScale = isOuter ? 0.27 : 0.24;
          const curlStrength = isOuter ? 0.30 : 0.22;

          addGridMesh(4, 8, (uNorm, v) => {
            const u = uNorm * 2 - 1;
            const halfW = Math.sin(Math.pow(v, 0.70) * Math.PI) * widthScale * scale;
            const wOff = u * halfW;

            const rad = scale * lengthScale * (0.04 + 0.64 * Math.pow(v, 1.06) + 0.08 * Math.sin(v * Math.PI));
            const ly = scale * lengthScale * (0.62 * Math.sin(v * Math.PI * 0.68) - curlStrength * Math.pow(v, 2.8))
                     + (1 - u * u) * 0.05 * scale * Math.sin(v * Math.PI);

            const lx = cosA * rad + perpX * wOff;
            const lz = sinA * rad + perpZ * wOff;
            const wp = toWorld(cx, cy, cz, basis, lx, ly, lz);

            let col;
            if (v < 0.24) {
              col = mixColor(COLORS.lilyThroat, bladeCol, v / 0.24);
            } else if (v < 0.72) {
              col = bladeCol;
              if (Math.abs(u) < 0.26 && v < 0.56) {
                col = mixColor(col, COLORS.lilySpeck, 0.30 * (1 - Math.abs(u) / 0.26));
              }
            } else {
              col = mixColor(bladeCol, tipCol, (v - 0.72) / 0.28);
            }

            return { x: wp.x, y: wp.y, z: wp.z, r: col[0], g: col[1], b: col[2] };
          }, false, basis.up);
        }

        // 6 longues étamines arquées + anthères dorées
        for (let s = 0; s < 6; s++) {
          const ang = (s / 6) * Math.PI * 2 + 0.28;
          const ca = Math.cos(ang);
          const sa = Math.sin(ang);

          for (let i = 1; i <= 7; i++) {
            const t = i / 7;
            const r = scale * (0.035 + 0.26 * Math.pow(t, 1.35));
            const ly = scale * (0.10 + 0.54 * t - 0.08 * t * t);
            const wp = toWorld(cx, cy, cz, basis, ca * r, ly, sa * r);

            if (i < 7) {
              addAccentPoint(wp.x, wp.y, wp.z, COLORS.stamenStem, i % 2 === 0 ? ":" : "|");
            } else {
              addAccentPoint(wp.x, wp.y, wp.z, COLORS.antherGold, "@");
              const wp2 = toWorld(cx, cy, cz, basis, ca * (r + 0.028 * scale), ly + 0.018 * scale, sa * (r + 0.028 * scale));
              addAccentPoint(wp2.x, wp2.y, wp2.z, COLORS.antherAmber, "*");
            }
          }
        }
        const pistilTop = toWorld(cx, cy, cz, basis, 0, 0.62 * scale, 0);
        addAccentPoint(pistilTop.x, pistilTop.y, pistilTop.z, COLORS.lilyThroat, "o");
      }

      // ==========================================
      // 3. TULIPE ÉLANCÉE 3D (accents latéraux harmonieux)
      // ==========================================
      function addTulip(cx, cy, cz, dir, scale, baseCol, tipCol) {
        const basis = basisFromDir(dir);
        const h = 0.66 * scale;
        const maxR = 0.32 * scale;

        for (let p = 0; p < 6; p++) {
          const pAngle = (p / 6) * Math.PI * 2;
          const rBoost = p % 2 === 0 ? 1.06 : 0.96;

          addGridMesh(3, 6, (uNorm, v) => {
            const u = uNorm * 2 - 1;
            const span = 0.56 * Math.sin(Math.pow(v, 0.65) * Math.PI * 0.92);
            const a = pAngle + u * span;
            const r = maxR * rBoost * Math.pow(Math.sin(v * Math.PI * 0.84), 0.64);
            const ly = v * h;

            const wp = toWorld(cx, cy, cz, basis, Math.cos(a) * r, ly, Math.sin(a) * r);
            const col = mixColor(baseCol, tipCol, v);
            const ao = 0.55 + 0.45 * v;
            return { x: wp.x, y: wp.y, z: wp.z, r: col[0] * ao, g: col[1] * ao, b: col[2] * ao };
          }, false, basis.up);
        }
      }

      // ==========================================
      // 4. FEUILLE ARRONDIE AVEC PETITE POINTE DOUCE AU BOUT
      //    (Forme botanique ovale type rosier / camélia)
      // ==========================================
      function addLeaf(ox, oy, oz, dir, length, width, colBase, colTip) {
        const basis = basisFromDir(dir);

        addGridMesh(4, 8, (uNorm, v) => {
          const u = uNorm * 2 - 1;

          // Courbe ovale bien arrondie sur tout le corps, puis petite pointe délicate tout au bout
          let profile;
          if (v < 0.84) {
            // Corps large et rond
            profile = Math.pow(Math.sin((v / 0.94) * Math.PI), 0.54);
          } else {
            // Finition douce vers une toute petite pointe au bout (v = 0.84 -> 1.0)
            const vt = (v - 0.84) / 0.16; // 0 à 1
            const startW = Math.pow(Math.sin((0.84 / 0.94) * Math.PI), 0.54);
            profile = startW * Math.pow(1 - vt, 1.35);
          }

          const w = width * profile;
          const lx = u * w;
          const ly = v * length;
          // Légère courbure naturelle + nervure centrale en V très doux
          const lz = -Math.pow(v, 1.8) * length * 0.24 + Math.abs(u) * w * 0.14;

          const wp = toWorld(ox, oy, oz, basis, lx, ly, lz);
          // Nervure centrale légèrement plus claire pour la lisibilité
          let col = mixColor(colBase, colTip, v * 0.85);
          if (Math.abs(u) < 0.18 && v < 0.85) {
            col = mixColor(col, COLORS.leafLight, 0.25 * (1 - Math.abs(u) / 0.18));
          }

          return { x: wp.x, y: wp.y, z: wp.z, r: col[0], g: col[1], b: col[2] };
        }, false, basis.forward);
      }

      // ==========================================
      // 5. GYPSOPHILE DÉLICAT (comble les petits espaces sans surcharger)
      // ==========================================
      function addBabysBreath(cx, cy, cz) {
        for (let i = 0; i < 6; i++) {
          const a = (i / 6) * Math.PI * 2;
          const r = 0.06 + (i % 2) * 0.045;
          const dy = ((i % 3) - 1) * 0.045;
          addAccentPoint(
            cx + Math.cos(a) * r,
            cy + dy,
            cz + Math.sin(a) * r,
            COLORS.whitePure,
            i % 2 === 0 ? "*" : "+"
          );
        }
      }

      // ==========================================
      // 6. PAPIER FLEURISTE OPAQUE (COL ARRIÈRE ABAISSÉ & ÉLÉGANT)
      // ==========================================
      function addWrap() {
        const yWaist = -0.90;
        const yBot = -1.76;

        // A. Cône sablier principal 100% opaque (zéro tige visible)
        addGridMesh(40, 20, (u, v) => {
          const a = u * Math.PI * 2;
          const frontDip = Math.max(0, Math.sin(a));
          const yTop = 0.48 - 0.18 * Math.pow(frontDip, 1.25) + 0.035 * Math.cos(a * 4);
          const yBotLocal = yBot + 0.04 * Math.sin(a * 5);

          const y = yBotLocal + v * (yTop - yBotLocal);

          let radius;
          if (y >= yWaist) {
            const k = (y - yWaist) / (yTop - yWaist);
            radius = 0.24 + Math.pow(k, 1.06) * 0.88;
          } else {
            const k = (yWaist - y) / (yWaist - yBotLocal);
            radius = 0.24 + Math.pow(k, 0.88) * 0.34;
          }

          const pleatAmp = y > yWaist ? 0.048 * ((y - yWaist) / (yTop - yWaist)) : 0.038;
          const pleat = Math.sin(a * 7 + y * 0.9) * pleatAmp;
          const r = radius + pleat;

          const x = Math.cos(a) * r;
          const z = Math.sin(a) * r;

          let col = mixColor(COLORS.wrapShadow, COLORS.wrapPearl, 0.45 + 0.55 * (Math.sin(a) * 0.5 + 0.5));
          if (y < yWaist) col = mixColor(col, COLORS.wrapSoft, 0.35);

          return { x, y, z, r: col[0], g: col[1], b: col[2] };
        }, true);

        // B. Fond fermé proprement sous la jupe du papier
        addGridMesh(20, 3, (u, v) => {
          const a = u * Math.PI * 2;
          const r = v * 0.54;
          const y = yBot + 0.08 * (1 - v) + 0.03 * Math.sin(a * 5) * v;
          const col = mixColor(COLORS.wrapInner, COLORS.wrapShadow, v);
          return { x: Math.cos(a) * r, y, z: Math.sin(a) * r, r: col[0], g: col[1], b: col[2] };
        }, true, [0, -1, 0]);

        // C. Coussin végétal discret à l'intérieur du haut du cône (évite tout vide noir quand on incline)
        addGridMesh(18, 5, (u, v) => {
          const a = u * Math.PI * 2;
          const r = v * 0.96;
          const y = 0.52 - 0.14 * v * v + 0.04 * Math.sin(a * 5) * v;
          const col = mixColor(COLORS.leafDark, COLORS.leafMid, 0.35 + 0.35 * v);
          return { x: Math.cos(a) * r, y, z: Math.sin(a) * r, r: col[0], g: col[1], b: col[2] };
        }, true, [0, 1, 0]);

        // D. Col de papier arrière ABAISSÉ et délicatement évasé (encadre sans jamais rentrer dans les fleurs)
        const sheets = [
          // [angleCentre, demiLargeur, hauteurMax, rayonBase, evaseExt]
          [-Math.PI * 0.50, 0.52, 1.16, 1.12, 0.42], // Pan central arrière (abaissé)
          [-Math.PI * 0.74, 0.44, 0.96, 1.12, 0.36], // Aile arrière gauche
          [-Math.PI * 0.26, 0.44, 0.96, 1.12, 0.36], // Aile arrière droite
          [-Math.PI * 0.95, 0.34, 0.78, 1.12, 0.24], // Rebord gauche
          [-Math.PI * 0.05, 0.34, 0.78, 1.12, 0.24]  // Rebord droit
        ];

        for (const [cAng, halfSpan, hTop, rBase, flareOut] of sheets) {
          addGridMesh(8, 7, (uNorm, v) => {
            const u = uNorm * 2 - 1;
            const span = halfSpan * (0.94 - v * 0.12);
            const a = cAng + u * span;
            const arch = (1 - u * u) * 0.12 * v;
            const y = 0.26 + v * (hTop - 0.26) + arch;
            // Évasé vers l'extérieur pour bercer les fleurs sans les couper
            const r = rBase + Math.pow(v, 1.25) * flareOut + (1 - u * u) * 0.08;

            const x = Math.cos(a) * r;
            const z = Math.sin(a) * r;
            const col = mixColor(COLORS.wrapShadow, COLORS.wrapPearl, 0.30 + v * 0.70);

            return { x, y, z, r: col[0], g: col[1], b: col[2] };
          }, false);
        }
      }

      // ==========================================
      // 7. RUBAN SATIN & GRAND NŒUD 3D SCULPTÉ
      // ==========================================
      function addRibbon() {
        const yWaist = -0.90;
        const rWaist = 0.29;

        addGridMesh(28, 3, (u, v) => {
          const a = u * Math.PI * 2;
          const y = yWaist + (v - 0.5) * 0.18;
          const col = mixColor(COLORS.ribbonDeep, COLORS.ribbonMain, 0.5 + 0.5 * Math.sin(v * Math.PI));
          return { x: Math.cos(a) * rWaist, y, z: Math.sin(a) * rWaist, r: col[0], g: col[1], b: col[2] };
        }, true);

        // Nœud central
        addGridMesh(8, 5, (u, v) => {
          const a = u * Math.PI * 2;
          const phi = (v - 0.5) * Math.PI;
          const x = Math.cos(a) * Math.cos(phi) * 0.11;
          const y = yWaist + Math.sin(phi) * 0.11;
          const z = rWaist + 0.08 + Math.sin(a) * Math.cos(phi) * 0.08;
          return { x, y, z, r: COLORS.ribbonMain[0], g: COLORS.ribbonMain[1], b: COLORS.ribbonMain[2] };
        }, true);

        // Deux boucles et pans fluides devant
        for (const side of [-1, 1]) {
          addGridMesh(12, 4, (u, v) => {
            const t = u * Math.PI * 2;
            const w = (v - 0.5) * 0.16;
            const loopX = side * (0.08 + (0.5 - 0.5 * Math.cos(t)) * 0.44);
            const loopY = yWaist + Math.sin(t) * 0.16 + w * 0.72;
            const loopZ = rWaist + 0.08 + Math.sin(t * 0.5) * 0.14 + Math.cos(t) * 0.04;
            const col = mixColor(COLORS.ribbonDeep, COLORS.ribbonMain, 0.4 + 0.6 * Math.sin(v * Math.PI));
            return { x: loopX, y: loopY, z: loopZ, r: col[0], g: col[1], b: col[2] };
          }, true);

          addGridMesh(3, 12, (uNorm, v) => {
            const u = uNorm * 2 - 1;
            const width = 0.066 + v * 0.032;
            const cx = side * (0.06 + v * 0.34 + Math.sin(v * Math.PI) * 0.06);
            const cy = yWaist - 0.05 - v * 0.76;
            const cz = rWaist + 0.08 + v * 0.34 + Math.sin(v * Math.PI * 1.3) * 0.07;

            const col = mixColor(COLORS.ribbonMain, COLORS.ribbonDeep, v * 0.45);
            return { x: cx + u * width, y: cy, z: cz + Math.abs(u) * 0.015, r: col[0], g: col[1], b: col[2] };
          }, false);
        }
      }

      // ==========================================
      // ASSEMBLAGE DU BOUQUET (ESPACEMENT VÉRIFIÉ — ZÉRO CHEVAUCHEMENT)
      // ==========================================
      function buildBouquet() {
        // 1. QUATRE GRANDS LYS EN COURONNE MAJESTUEUSE (aucune collision entre eux ni avec les roses)
        const lilySpecs = [
          // [x, y, z, dir, scale, bladeCol, tipCol]
          [ 0.00,  1.76, -0.08, [ 0.00,  0.94,  0.34], 0.92, COLORS.lilyWhite, COLORS.lilyBlush], // Lys roi au sommet
          [-1.24,  1.44, -0.08, [-0.68,  0.70,  0.22], 0.86, COLORS.lilyWhite, COLORS.lilyBlush], // Lys haut gauche
          [ 1.24,  1.44, -0.08, [ 0.68,  0.70,  0.22], 0.86, COLORS.lilyWhite, COLORS.lilyBlush], // Lys haut droit
          [ 0.00,  1.44, -0.94, [ 0.00,  0.74, -0.67], 0.86, COLORS.lilyBlush, COLORS.lilyWhite]  // Lys haut arrière
        ];
        for (const [x, y, z, dir, sc, bCol, tCol] of lilySpecs) {
          addLily(x, y, z, dir, sc, bCol, tCol);
        }

        // 2. SEPT VRAIES ROSES 3D SCULPTÉES (parfaitement espacées en dôme équilibré)
        const roseSpecs = [
          // [x, y, z, dir, radius, coreCol, midCol, edgeCol]
          [ 0.00,  0.72,  0.92, [ 0.00,  0.40,  0.92], 0.46, COLORS.crimsonCore, COLORS.crimsonMid, COLORS.crimsonEdge], // Rose rouge centrale
          [-0.64,  1.28,  0.56, [-0.36,  0.68,  0.64], 0.42, COLORS.pinkCore,    COLORS.pinkMid,    COLORS.pinkEdge],    // Rose poudrée haut-gauche
          [ 0.64,  1.28,  0.56, [ 0.36,  0.68,  0.64], 0.42, COLORS.champCore,   COLORS.champMid,   COLORS.champEdge],   // Rose champagne haut-droite
          [-1.08,  0.58,  0.66, [-0.64,  0.32,  0.70], 0.43, COLORS.crimsonCore, COLORS.crimsonMid, COLORS.crimsonEdge], // Rose rouge avant-gauche
          [ 1.08,  0.58,  0.66, [ 0.64,  0.32,  0.70], 0.43, COLORS.pinkCore,    COLORS.pinkMid,    COLORS.pinkEdge],    // Rose poudrée avant-droite
          [-0.84,  1.12, -0.76, [-0.58,  0.58, -0.58], 0.42, COLORS.crimsonCore, COLORS.crimsonMid, COLORS.crimsonEdge], // Rose rouge arrière-gauche
          [ 0.84,  1.12, -0.76, [ 0.58,  0.58, -0.58], 0.42, COLORS.pinkCore,    COLORS.pinkMid,    COLORS.pinkEdge]     // Rose poudrée arrière-droite
        ];
        for (const [x, y, z, dir, r, cCol, mCol, eCol] of roseSpecs) {
          addRose(x, y, z, dir, r, cCol, mCol, eCol);
        }

        // 3. DEUX TULIPES LATÉRALES HARMONIEUSES (élargissent la silhouette sans chevaucher)
        addTulip(-1.26, 0.58, -0.10, [-0.88, 0.46, -0.06], 0.92, COLORS.lilacDeep, COLORS.lilacSoft);
        addTulip( 1.26, 0.58, -0.10, [ 0.88, 0.46, -0.06], 0.92, COLORS.champCore, COLORS.champEdge);

        // 4. FEUILLES ARRONDIES À PETITE POINTE DOUCE (en collerette sous les fleurs, zéro collision)
        const leafCount = 14;
        for (let i = 0; i < leafCount; i++) {
          const a = (i / leafCount) * Math.PI * 2 + 0.22;
          const ca = Math.cos(a);
          const sa = Math.sin(a);
          // Inclinaison douce vers l'extérieur juste au-dessus du bord du papier
          const elev = sa > 0.2 ? 0.08 : 0.16;
          const dir = [ca * 0.96, elev, sa * 0.96];
          addLeaf(
            ca * 0.78, 0.40, sa * 0.78,
            dir,
            0.84 + (i % 2) * 0.10, // Longueur harmonieuse
            0.34 + (i % 2) * 0.04, // Largeur généreuse pour un bel arrondi
            i % 2 === 0 ? COLORS.leafDark : COLORS.leafMid,
            i % 2 === 0 ? COLORS.leafMid  : COLORS.leafLight
          );
        }

        // Quelques feuilles arrondies plus hautes dans les creux entre les lys et les roses
        const accentLeaves = [
          [-0.62, 1.18, -0.16, [-0.52, 0.82, -0.22], 0.68, 0.26],
          [ 0.62, 1.18, -0.16, [ 0.52, 0.82, -0.22], 0.68, 0.26],
          [ 0.00, 1.24,  0.34, [ 0.00, 0.86,  0.50], 0.62, 0.25],
          [ 0.00, 1.16, -0.58, [ 0.00, 0.82, -0.58], 0.64, 0.25]
        ];
        for (const [lx, ly, lz, dir, len, w] of accentLeaves) {
          addLeaf(lx, ly, lz, dir, len, w, COLORS.leafDark, COLORS.leafLight);
        }

        // 5. GYPSOPHILE DÉLICAT DANS LES ESPACES LIBRES
        const babyCoords = [
          [-0.64, 1.72,  0.18], [ 0.64, 1.72,  0.18],
          [-0.48, 0.88,  0.88], [ 0.48, 0.88,  0.88],
          [-1.12, 1.08,  0.40], [ 1.12, 1.08,  0.40],
          [-0.56, 1.54, -0.78], [ 0.56, 1.54, -0.78],
          [-1.12, 1.08, -0.48], [ 1.12, 1.08, -0.48]
        ];
        for (const [bx, by, bz] of babyCoords) {
          addBabysBreath(bx, by, bz);
        }

        // 6. PAPIER OPAQUE + RUBAN SATIN
        addWrap();
        addRibbon();
      }

      buildBouquet();

      // Tableaux typés pour la performance à haute résolution
      const vertCount = mX.length;
      const vX  = Float32Array.from(mX);
      const vY  = Float32Array.from(mY);
      const vZ  = Float32Array.from(mZ);
      const vNX = Float32Array.from(mNX);
      const vNY = Float32Array.from(mNY);
      const vNZ = Float32Array.from(mNZ);
      const vR  = Uint8Array.from(mR);
      const vG  = Uint8Array.from(mG);
      const vB  = Uint8Array.from(mB);

      const triCount = mTriA.length;
      const triA = Uint32Array.from(mTriA);
      const triB = Uint32Array.from(mTriB);
      const triC = Uint32Array.from(mTriC);

      const svX   = new Float32Array(vertCount);
      const svY   = new Float32Array(vertCount);
      const svZ   = new Float32Array(vertCount);
      const svLum = new Float32Array(vertCount);

      const accentCount = ptX.length;
      const aX  = Float32Array.from(ptX);
      const aY  = Float32Array.from(ptY);
      const aZ  = Float32Array.from(ptZ);
      const aR  = Uint8Array.from(ptR);
      const aG  = Uint8Array.from(ptG);
      const aB  = Uint8Array.from(ptB);
      const aCh = Uint8Array.from(ptCh);

      // 64 particules flottantes scintillantes autour du bouquet
      const sparkleColors = [COLORS.pinkEdge, COLORS.champEdge, COLORS.lilyWhite, COLORS.lilacSoft];
      const sparkleChars  = ["*", "+", ".", "*"];
      const sparkles = Array.from({ length: 64 }, (_, i) => ({
        angle: (i / 64) * Math.PI * 2 + (i % 7) * 0.19,
        radius: 1.98 + ((i * 41) % 100) / 88,
        yBase: -1.60 + ((i * 59) % 100) / 100 * 3.95,
        speed: 0.30 + ((i * 31) % 100) / 185,
        phase: (i * 1.618) % (Math.PI * 2),
        ch: sparkleChars[i % sparkleChars.length].charCodeAt(0),
        color: sparkleColors[i % sparkleColors.length]
      }));

      // ==========================================
      // Caméra & Contrôles (Souris + Trackpad + Tactile)
      // ==========================================
      let yaw = 0;
      let pitch = 0.14;
      let zoom = 1.0;

      let velYaw = 0;
      let velPitch = 0;
      const AUTO_SPIN_SPEED = -0.0062;

      const activePointers = new Map();
      let isDragging = false;
      let lastX = 0;
      let lastY = 0;
      let lastPinchDist = 0;
      let lastTapTime = 0;

      canvas.addEventListener("pointerdown", (e) => {
        canvas.setPointerCapture(e.pointerId);
        activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

        const now = performance.now();
        if (activePointers.size === 1 && now - lastTapTime < 280) {
          pitch = 0.14;
          zoom = 1.0;
          velYaw = 0;
          velPitch = 0;
        }
        lastTapTime = now;

        if (activePointers.size === 1) {
          isDragging = true;
          lastX = e.clientX;
          lastY = e.clientY;
        } else if (activePointers.size === 2) {
          isDragging = false;
          const pts = [...activePointers.values()];
          lastPinchDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
        }
      });

      canvas.addEventListener("pointermove", (e) => {
        if (!activePointers.has(e.pointerId)) return;
        activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

        if (activePointers.size === 1 && isDragging) {
          const dx = e.clientX - lastX;
          const dy = e.clientY - lastY;
          lastX = e.clientX;
          lastY = e.clientY;

          // Sens naturel (glisser à gauche fait tourner le bouquet vers la gauche)
          velYaw = -dx * 0.009;
          velPitch = dy * 0.007;
          yaw += velYaw;
          pitch = Math.max(-0.95, Math.min(1.05, pitch + velPitch));
        } else if (activePointers.size === 2) {
          const pts = [...activePointers.values()];
          const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
          if (lastPinchDist > 0) {
            zoom = Math.max(0.55, Math.min(2.3, zoom * (dist / lastPinchDist)));
          }
          lastPinchDist = dist;
        }
      });

      function endPointer(e) {
        activePointers.delete(e.pointerId);
        if (activePointers.size === 1) {
          const [pt] = activePointers.values();
          isDragging = true;
          lastX = pt.x;
          lastY = pt.y;
        } else if (activePointers.size === 0) {
          isDragging = false;
          lastPinchDist = 0;
        }
      }

      canvas.addEventListener("pointerup", endPointer);
      canvas.addEventListener("pointercancel", endPointer);

      canvas.addEventListener("wheel", (e) => {
        e.preventDefault();
        const factor = e.deltaY > 0 ? 0.92 : 1.08;
        zoom = Math.max(0.55, Math.min(2.3, zoom * factor));
      }, { passive: false });

      // ==========================================
      // Grille ASCII Haute Résolution & Buffers
      // ==========================================
      let cols = 0;
      let rows = 0;
      let charW = 6;
      let charH = 10;
      let fontSize = 10;
      let zBuf  = new Float32Array(0);
      let chBuf = new Uint8Array(0);
      let rBuf  = new Uint8Array(0);
      let gBuf  = new Uint8Array(0);
      let bBuf  = new Uint8Array(0);

      function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const w = window.innerWidth;
        const h = window.innerHeight;

        canvas.width = Math.floor(w * dpr);
        canvas.height = Math.floor(h * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        // Résolution ASCII affinée (~40% plus de détails lisibles sur tous les écrans)
        const minDim = Math.min(w, h);
        fontSize = Math.max(6.5, Math.min(10.5, Math.round((minDim / 80) * 2) / 2));
        ctx.font = `bold ${fontSize}px "JetBrains Mono", "Fira Code", Consolas, monospace`;
        ctx.textBaseline = "top";

        charW = ctx.measureText("M").width;
        charH = Math.max(7, Math.round(fontSize * 1.12));

        cols = Math.max(40, Math.floor(w / charW));
        rows = Math.max(32, Math.floor(h / charH));

        const size = cols * rows;
        zBuf  = new Float32Array(size);
        chBuf = new Uint8Array(size);
        rBuf  = new Uint8Array(size);
        gBuf  = new Uint8Array(size);
        bBuf  = new Uint8Array(size);
      }

      window.addEventListener("resize", resize);
      resize();

      // ==========================================
      // Boucle de rendu 3D (Rasterizer ASCII + Batching Rapide)
      // ==========================================
      const lightDir = normalize([0.42, 0.74, 0.86]);
      const rimDir   = normalize([-0.55, 0.45, -0.65]);
      const colorCache = new Map();

      function getQuantizedColor(r, g, b) {
        const qr = r & 248;
        const qg = g & 248;
        const qb = b & 248;
        const key = (qr << 16) | (qg << 8) | qb;
        let str = colorCache.get(key);
        if (!str) {
          str = `rgb(${qr},${qg},${qb})`;
          if (colorCache.size > 4096) colorCache.clear();
          colorCache.set(key, str);
        }
        return str;
      }

      function render(time) {
        requestAnimationFrame(render);

        if (!isDragging) {
          yaw += AUTO_SPIN_SPEED + velYaw;
          pitch = Math.max(-0.95, Math.min(1.05, pitch + velPitch));
          velYaw *= 0.92;
          velPitch *= 0.92;
        }

        zBuf.fill(-1e9);
        chBuf.fill(0);

        const cosY = Math.cos(yaw);
        const sinY = Math.sin(yaw);
        const cosX = Math.cos(pitch);
        const sinX = Math.sin(pitch);

        const usableRows = rows - 5;
        const centerCol = cols * 0.5;
        const centerRow = usableRows * 0.52;

        // Mise à l'échelle généreuse (bouquet imposant et bien centré)
        const charAspect = charH / charW;
        const scaleY = Math.min(usableRows * 0.215, (cols / charAspect) * 0.245) * zoom;
        const scaleX = scaleY * charAspect;
        const camDist = 7.4;

        // 1. Transformation des sommets
        for (let i = 0; i < vertCount; i++) {
          const px = vX[i];
          const py = vY[i] - 0.16;
          const pz = vZ[i];

          const x1 = px * cosY - pz * sinY;
          const z1 = px * sinY + pz * cosY;
          const y2 = py * cosX - z1 * sinX;
          const z2 = py * sinX + z1 * cosX;

          const invZ = camDist / (camDist - z2);
          svX[i] = centerCol + x1 * scaleX * invZ;
          svY[i] = centerRow - y2 * scaleY * invZ;
          svZ[i] = z2;

          const nx = vNX[i], ny = vNY[i], nz = vNZ[i];
          const nx1 = nx * cosY - nz * sinY;
          const nz1 = nx * sinY + nz * cosY;
          const ny2 = ny * cosX - nz1 * sinX;
          const nz2 = ny * sinX + nz1 * cosX;

          const dMain = nx1 * lightDir[0] + ny2 * lightDir[1] + nz2 * lightDir[2];
          const dRim  = nx1 * rimDir[0]   + ny2 * rimDir[1]   + nz2 * rimDir[2];
          const key   = dMain >= 0 ? dMain : -dMain * 0.58;
          const rim   = Math.max(0, Math.abs(dRim)) * 0.22;
          svLum[i] = Math.max(0.18, Math.min(1.0, 0.26 + key * 0.70 + rim));
        }

        // 2. Rasterisation des triangles en grille ASCII (Z-buffer opaque)
        const rampLen = RAMP_CODES.length;
        for (let t = 0; t < triCount; t++) {
          const i0 = triA[t];
          const i1 = triB[t];
          const i2 = triC[t];

          const x0 = svX[i0], y0 = svY[i0], z0 = svZ[i0];
          const x1 = svX[i1], y1 = svY[i1], z1 = svZ[i1];
          const x2 = svX[i2], y2 = svY[i2], z2 = svZ[i2];

          const area = (x1 - x0) * (y2 - y0) - (x2 - x0) * (y1 - y0);
          if (area > -1e-4 && area < 1e-4) continue;

          let minX = Math.floor(Math.min(x0, x1, x2));
          let maxX = Math.ceil(Math.max(x0, x1, x2));
          let minY = Math.floor(Math.min(y0, y1, y2));
          let maxY = Math.ceil(Math.max(y0, y1, y2));

          if (maxX < 0 || minX >= cols || maxY < 0 || minY >= usableRows) continue;
          if (minX < 0) minX = 0;
          if (maxX >= cols) maxX = cols - 1;
          if (minY < 0) minY = 0;
          if (maxY >= usableRows) maxY = usableRows - 1;

          const invArea = 1 / area;
          const l0 = svLum[i0], l1 = svLum[i1], l2 = svLum[i2];
          const r0 = vR[i0], r1 = vR[i1], r2 = vR[i2];
          const g0 = vG[i0], g1 = vG[i1], g2 = vG[i2];
          const b0 = vB[i0], b1 = vB[i1], b2 = vB[i2];

          for (let py = minY; py <= maxY; py++) {
            const sy = py + 0.5;
            const rowOff = py * cols;
            for (let px = minX; px <= maxX; px++) {
              const sx = px + 0.5;
              const w0 = ((x1 - sx) * (y2 - sy) - (x2 - sx) * (y1 - sy)) * invArea;
              if (w0 < -0.02) continue;
              const w1 = ((x2 - sx) * (y0 - sy) - (x0 - sx) * (y2 - sy)) * invArea;
              if (w1 < -0.02) continue;
              const w2 = 1 - w0 - w1;
              if (w2 < -0.02) continue;

              const z = w0 * z0 + w1 * z1 + w2 * z2;
              const idx = rowOff + px;
              if (z > zBuf[idx]) {
                zBuf[idx] = z;
                const lum = w0 * l0 + w1 * l1 + w2 * l2;
                const rIdx = Math.min(rampLen - 1, Math.max(1, (lum * rampLen) | 0));
                chBuf[idx] = RAMP_CODES[rIdx];

                const shade = 0.46 + lum * 0.60;
                const cr = (w0 * r0 + w1 * r1 + w2 * r2) * shade;
                const cg = (w0 * g0 + w1 * g1 + w2 * g2) * shade;
                const cb = (w0 * b0 + w1 * b1 + w2 * b2) * shade;
                rBuf[idx] = cr > 255 ? 255 : cr | 0;
                gBuf[idx] = cg > 255 ? 255 : cg | 0;
                bBuf[idx] = cb > 255 ? 255 : cb | 0;
              }
            }
          }
        }

        // 3. Points d'accent (étamines des lys & gypsophile blanc)
        for (let i = 0; i < accentCount; i++) {
          const px = aX[i];
          const py = aY[i] - 0.16;
          const pz = aZ[i];

          const x1 = px * cosY - pz * sinY;
          const z1 = px * sinY + pz * cosY;
          const y2 = py * cosX - z1 * sinX;
          const z2 = py * sinX + z1 * cosX;

          const invZ = camDist / (camDist - z2);
          const sx = (centerCol + x1 * scaleX * invZ) | 0;
          const sy = (centerRow - y2 * scaleY * invZ) | 0;

          if (sx >= 0 && sx < cols && sy >= 0 && sy < usableRows) {
            const idx = sy * cols + sx;
            if (z2 + 0.05 > zBuf[idx]) {
              zBuf[idx] = z2 + 0.05;
              chBuf[idx] = aCh[i];
              rBuf[idx] = aR[i];
              gBuf[idx] = aG[i];
              bBuf[idx] = aB[i];
            }
          }
        }

        // 4. 64 particules flottantes scintillantes
        const tSec = time * 0.001;
        for (let i = 0; i < sparkles.length; i++) {
          const sp = sparkles[i];
          const a = sp.angle + tSec * 0.22 * sp.speed;
          const px = Math.cos(a) * sp.radius;
          const pz = Math.sin(a) * sp.radius;
          const py = sp.yBase + Math.sin(tSec * sp.speed + sp.phase) * 0.24 - 0.16;

          const x1 = px * cosY - pz * sinY;
          const z1 = px * sinY + pz * cosY;
          const y2 = py * cosX - z1 * sinX;
          const z2 = py * sinX + z1 * cosX;

          const invZ = camDist / (camDist - z2);
          const sx = (centerCol + x1 * scaleX * invZ) | 0;
          const sy = (centerRow - y2 * scaleY * invZ) | 0;

          if (sx >= 0 && sx < cols && sy >= 0 && sy < usableRows) {
            const idx = sy * cols + sx;
            if (z2 > zBuf[idx]) {
              const twinkle = 0.40 + 0.60 * Math.sin(tSec * 2.8 + sp.phase);
              if (twinkle > 0.34) {
                zBuf[idx] = z2;
                chBuf[idx] = sp.ch;
                rBuf[idx] = (sp.color[0] * twinkle) | 0;
                gBuf[idx] = (sp.color[1] * twinkle) | 0;
                bBuf[idx] = (sp.color[2] * twinkle) | 0;
              }
            }
          }
        }

        // 5. Dessin optimisé par lots de couleur sur fond noir pur
        ctx.fillStyle = "#000000";
        ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

        ctx.font = `bold ${fontSize}px "JetBrains Mono", "Fira Code", Consolas, monospace`;
        const offsetX = (window.innerWidth - cols * charW) * 0.5;
        const offsetY = (window.innerHeight - rows * charH) * 0.5;

        let lastFill = "";
        for (let y = 0; y < usableRows; y++) {
          const rowOff = y * cols;
          const py = offsetY + y * charH;
          let x = 0;

          while (x < cols) {
            const idx = rowOff + x;
            const code = chBuf[idx];
            if (code === 0) {
              x++;
              continue;
            }

            const qr = rBuf[idx] & 248;
            const qg = gBuf[idx] & 248;
            const qb = bBuf[idx] & 248;
            const startX = x;
            let run = CHAR_LUT[code];
            x++;

            // Regroupe les caractères consécutifs de même couleur quantifiée
            while (x < cols) {
              const nIdx = rowOff + x;
              const nCode = chBuf[nIdx];
              if (
                nCode === 0 ||
                (rBuf[nIdx] & 248) !== qr ||
                (gBuf[nIdx] & 248) !== qg ||
                (bBuf[nIdx] & 248) !== qb
              ) {
                break;
              }
              run += CHAR_LUT[nCode];
              x++;
            }

            const fill = getQuantizedColor(qr, qg, qb);
            if (fill !== lastFill) {
              ctx.fillStyle = fill;
              lastFill = fill;
            }
            ctx.fillText(run, offsetX + startX * charW, py);
          }
        }

        // 6. Texte ASCII en bas ("I love you sweetheart <3")
        const msgFontSize = Math.max(12, Math.min(20, Math.floor(window.innerWidth / (MESSAGE.length * 0.72))));
        ctx.font = `bold ${msgFontSize}px "JetBrains Mono", "Fira Code", Consolas, monospace`;
        const pulse = 0.86 + 0.14 * Math.sin(tSec * 2.2);
        ctx.fillStyle = `rgb(${(255 * pulse) | 0},${(135 * pulse) | 0},${(188 * pulse) | 0})`;

        const textWidth = ctx.measureText(MESSAGE).width;
        const textX = (window.innerWidth - textWidth) * 0.5;
        const textY = window.innerHeight - msgFontSize * 2.1;
        ctx.fillText(MESSAGE, textX, textY);
      }

      requestAnimationFrame(render);
    })();
  </script>
</body>
</html>
