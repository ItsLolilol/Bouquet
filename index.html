<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>For You</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #000000;
      overflow: hidden;
      font-family: "JetBrains Mono", "Fira Code", "SF Mono", "Cascadia Code", Consolas, "Courier New", monospace;
    }

    #scene {
      display: block;
      width: 100vw;
      height: 100dvh;
      touch-action: none;
      cursor: grab;
    }

    #scene:active {
      cursor: grabbing;
    }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>

  <script>
    (() => {
      const canvas = document.getElementById("scene");
      const ctx = canvas.getContext("2d", { alpha: false });

      // Message affiché en ASCII en bas du bouquet
      const MESSAGE = "I love you sweetheart <3";

      // Palette de densité ASCII (du sombre au lumineux)
      const RAMP = " .,:;-=+*#%@";
      const RAMP_CODES = Uint8Array.from(RAMP, (c) => c.charCodeAt(0));

      // Palette harmonieuse romantique & lumineuse sur fond noir
      const COLORS = {
        lilyWhite:   [252, 249, 255],
        lilyThroat:  [228, 242, 204],
        lilyBlush:   [255, 198, 222],
        lilySpeck:   [235, 115, 158],
        stamenStem:  [235, 242, 215],
        antherGold:  [255, 188, 52],
        antherAmber: [232, 122, 38],

        crimsonDeep: [175, 22, 54],
        crimson:     [235, 42, 78],
        rosePink:    [255, 115, 168],
        blushPink:   [255, 182, 212],
        lilacSoft:   [206, 150, 255],
        champagne:   [255, 222, 168],
        goldCenter:  [255, 200, 72],

        leafLight:   [72, 205, 122],
        leafMid:     [44, 165, 92],
        leafDark:    [26, 118, 66],

        wrapPearl:   [234, 230, 240],
        wrapSoft:    [202, 198, 214],
        wrapShadow:  [164, 162, 180],
        wrapInner:   [138, 134, 152],

        ribbonMain:  [248, 58, 115],
        ribbonDeep:  [190, 30, 78],
        whitePure:   [255, 255, 255]
      };

      // ==========================================
      // Utilitaires mathématiques 3D
      // ==========================================
      function normalize(v) {
        const len = Math.hypot(v[0], v[1], v[2]) || 1;
        return [v[0] / len, v[1] / len, v[2] / len];
      }

      function cross(a, b) {
        return [
          a[1] * b[2] - a[2] * b[1],
          a[2] * b[0] - a[0] * b[2],
          a[0] * b[1] - a[1] * b[0]
        ];
      }

      function basisFromDir(dir) {
        const up = normalize(dir);
        const helper = Math.abs(up[1]) < 0.9 ? [0, 1, 0] : [1, 0, 0];
        const right = normalize(cross(helper, up));
        const forward = normalize(cross(up, right));
        return { right, up, forward };
      }

      function mixColor(c1, c2, t) {
        const k = Math.max(0, Math.min(1, t));
        return [
          c1[0] + (c2[0] - c1[0]) * k,
          c1[1] + (c2[1] - c1[1]) * k,
          c1[2] + (c2[2] - c1[2]) * k
        ];
      }

      // ==========================================
      // Stockage Géométrie : Maillage 3D + Points d'accent
      // ==========================================
      const mX = [], mY = [], mZ = [];
      const mNX = [], mNY = [], mNZ = [];
      const mR = [], mG = [], mB = [];
      const mTriA = [], mTriB = [], mTriC = [];

      const ptX = [], ptY = [], ptZ = [];
      const ptR = [], ptG = [], ptB = [];
      const ptCh = [];

      function addAccentPoint(x, y, z, col, ch = "*") {
        ptX.push(x); ptY.push(y); ptZ.push(z);
        ptR.push(col[0]); ptG.push(col[1]); ptB.push(col[2]);
        ptCh.push(ch.charCodeAt(0));
      }

      // Générateur générique de surface 3D maillée (100% opaque, zéro trou)
      function addGridMesh(uSteps, vSteps, evalFn, wrapU = false, fallbackNormal = [0, 1, 0]) {
        const colsU = wrapU ? uSteps : uSteps + 1;
        const rowsV = vSteps + 1;
        const baseIdx = mX.length;

        const gridPos = new Array(rowsV * colsU);

        for (let iv = 0; iv < rowsV; iv++) {
          const v = iv / vSteps;
          for (let iu = 0; iu < colsU; iu++) {
            const u = wrapU ? (iu / uSteps) : (iu / uSteps);
            const res = evalFn(u, v);
            gridPos[iv * colsU + iu] = res;
            mX.push(res.x); mY.push(res.y); mZ.push(res.z);
            mR.push(res.r); mG.push(res.g); mB.push(res.b);
            mNX.push(0); mNY.push(0); mNZ.push(0);
          }
        }

        // Calcul de normales lisses à partir des voisins de la grille
        for (let iv = 0; iv < rowsV; iv++) {
          for (let iu = 0; iu < colsU; iu++) {
            const iuPrev = wrapU ? (iu - 1 + colsU) % colsU : Math.max(0, iu - 1);
            const iuNext = wrapU ? (iu + 1) % colsU : Math.min(colsU - 1, iu + 1);
            const ivPrev = Math.max(0, iv - 1);
            const ivNext = Math.min(rowsV - 1, iv + 1);

            const pL = gridPos[iv * colsU + iuPrev];
            const pR = gridPos[iv * colsU + iuNext];
            const pD = gridPos[ivPrev * colsU + iu];
            const pU = gridPos[ivNext * colsU + iu];

            const tu = [pR.x - pL.x, pR.y - pL.y, pR.z - pL.z];
            const tv = [pU.x - pD.x, pU.y - pD.y, pU.z - pD.z];
            let n = cross(tu, tv);
            const len = Math.hypot(n[0], n[1], n[2]);

            if (len < 1e-5) {
              n = normalize(fallbackNormal);
            } else {
              n = [n[0] / len, n[1] / len, n[2] / len];
            }

            const idx = baseIdx + iv * colsU + iu;
            mNX[idx] = n[0];
            mNY[idx] = n[1];
            mNZ[idx] = n[2];
          }
        }

        // Triangulation de la grille
        for (let iv = 0; iv < vSteps; iv++) {
          for (let iu = 0; iu < uSteps; iu++) {
            const iuNext = wrapU ? (iu + 1) % colsU : iu + 1;
            const i00 = baseIdx + iv * colsU + iu;
            const i10 = baseIdx + iv * colsU + iuNext;
            const i01 = baseIdx + (iv + 1) * colsU + iu;
            const i11 = baseIdx + (iv + 1) * colsU + iuNext;

            mTriA.push(i00, i00);
            mTriB.push(i10, i11);
            mTriC.push(i11, i01);
          }
        }
      }

      function toWorld(cx, cy, cz, basis, lx, ly, lz) {
        return {
          x: cx + basis.right[0] * lx + basis.up[0] * ly + basis.forward[0] * lz,
          y: cy + basis.right[1] * lx + basis.up[1] * ly + basis.forward[1] * lz,
          z: cz + basis.right[2] * lx + basis.up[2] * ly + basis.forward[2] * lz
        };
      }

      // ==========================================
      // 1. FLEUR DE LYS 3D (6 pétales recourbés + étamines dorées)
      // ==========================================
      function addLily(cx, cy, cz, dir, scale, bladeCol, tipCol) {
        const basis = basisFromDir(dir);

        // 6 pétales (2 verticilles alternés de 3 pétales)
        for (let p = 0; p < 6; p++) {
          const isOuter = p % 2 === 1;
          const pAngle = (p / 6) * Math.PI * 2;
          const cosA = Math.cos(pAngle);
          const sinA = Math.sin(pAngle);
          const perpX = -sinA;
          const perpZ = cosA;

          const lengthScale = isOuter ? 1.05 : 0.98;
          const widthScale = isOuter ? 0.28 : 0.25;
          const curlStrength = isOuter ? 0.28 : 0.20;

          addGridMesh(4, 7, (uNorm, v) => {
            const u = uNorm * 2 - 1; // -1 à 1
            // Profil pointu typique du lys
            const halfW = Math.sin(Math.pow(v, 0.72) * Math.PI) * widthScale * scale;
            const wOff = u * halfW;

            // Courbe en trompette gracieusement recourbée vers l'extérieur
            const rad = scale * lengthScale * (0.045 + 0.68 * Math.pow(v, 1.06) + 0.08 * Math.sin(v * Math.PI));
            const ly = scale * lengthScale * (0.64 * Math.sin(v * Math.PI * 0.68) - curlStrength * Math.pow(v, 2.8))
                     + (1 - u * u) * 0.055 * scale * Math.sin(v * Math.PI)
                     + Math.sin(v * 12) * 0.014 * scale * Math.abs(u);

            const lx = cosA * rad + perpX * wOff;
            const lz = sinA * rad + perpZ * wOff;
            const wPos = toWorld(cx, cy, cz, basis, lx, ly, lz);

            // Dégradé naturel : gorge vert-crème -> pétale nacré -> pointe rosée + nervure
            let col;
            if (v < 0.24) {
              col = mixColor(COLORS.lilyThroat, bladeCol, v / 0.24);
            } else if (v < 0.72) {
              col = bladeCol;
              if (Math.abs(u) < 0.28 && v < 0.56) {
                col = mixColor(col, COLORS.lilySpeck, 0.28 * (1 - Math.abs(u) / 0.28));
              }
            } else {
              col = mixColor(bladeCol, tipCol, (v - 0.72) / 0.28);
            }

            return { x: wPos.x, y: wPos.y, z: wPos.z, r: col[0], g: col[1], b: col[2] };
          }, false, basis.up);
        }

        // 6 longues étamines arquées + anthères dorées au bout (signature visuelle du lys)
        for (let s = 0; s < 6; s++) {
          const ang = (s / 6) * Math.PI * 2 + 0.28;
          const ca = Math.cos(ang);
          const sa = Math.sin(ang);

          for (let i = 1; i <= 7; i++) {
            const t = i / 7;
            const r = scale * (0.04 + 0.28 * Math.pow(t, 1.35));
            const ly = scale * (0.10 + 0.58 * t - 0.08 * t * t);
            const wp = toWorld(cx, cy, cz, basis, ca * r, ly, sa * r);

            if (i < 7) {
              addAccentPoint(wp.x, wp.y, wp.z, COLORS.stamenStem, i % 2 === 0 ? ":" : "|");
            } else {
              // Anthère de pollen ambrée lumineuse
              addAccentPoint(wp.x, wp.y, wp.z, COLORS.antherGold, "@");
              const wp2 = toWorld(cx, cy, cz, basis, ca * (r + 0.03 * scale), ly + 0.02 * scale, sa * (r + 0.03 * scale));
              addAccentPoint(wp2.x, wp2.y, wp2.z, COLORS.antherAmber, "*");
            }
          }
        }
        // Pistil central
        const pistilTop = toWorld(cx, cy, cz, basis, 0, 0.66 * scale, 0);
        addAccentPoint(pistilTop.x, pistilTop.y, pistilTop.z, COLORS.lilyThroat, "o");
      }

      // ==========================================
      // 2. ROSE VELOURS 3D (couches de pétales en spirale)
      // ==========================================
      function addRose(cx, cy, cz, dir, radius, innerCol, outerCol) {
        const basis = basisFromDir(dir);
        const layers = 4;

        for (let l = 0; l < layers; l++) {
          const lt = l / (layers - 1);
          const layerR = radius * (0.24 + lt * 0.76);
          const petalsInLayer = 4 + l * 2;
          const colBase = mixColor(innerCol, outerCol, lt * 0.75);
          const colTip = mixColor(innerCol, outerCol, Math.min(1, lt + 0.35));

          for (let p = 0; p < petalsInLayer; p++) {
            const pAngle = (p / petalsInLayer) * Math.PI * 2 + l * 0.72;
            const arcSpan = (Math.PI / petalsInLayer) * 1.38;

            addGridMesh(3, 4, (uNorm, v) => {
              const u = uNorm * 2 - 1;
              const a = pAngle + u * arcSpan * (0.65 + 0.35 * Math.sin(v * Math.PI * 0.75));
              const flare = layerR * (0.58 + v * (0.32 + lt * 0.48)) + (1 - u * u) * 0.07 * radius * v;
              const ly = v * radius * (0.58 - lt * 0.14) - Math.pow(v, 2.2) * lt * 0.14 * radius;

              const lx = Math.cos(a) * flare;
              const lz = Math.sin(a) * flare;
              const wp = toWorld(cx, cy, cz, basis, lx, ly, lz);
              const col = mixColor(colBase, colTip, v);

              return { x: wp.x, y: wp.y, z: wp.z, r: col[0], g: col[1], b: col[2] };
            }, false, basis.up);
          }
        }
      }

      // ==========================================
      // 3. TULIPE ÉLANCÉE 3D
      // ==========================================
      function addTulip(cx, cy, cz, dir, scale, baseCol, tipCol) {
        const basis = basisFromDir(dir);
        const h = 0.74 * scale;
        const maxR = 0.36 * scale;

        for (let p = 0; p < 6; p++) {
          const pAngle = (p / 6) * Math.PI * 2;
          const isOuter = p % 2 === 0;
          const rBoost = isOuter ? 1.06 : 0.96;

          addGridMesh(3, 5, (uNorm, v) => {
            const u = uNorm * 2 - 1;
            const span = 0.56 * Math.sin(Math.pow(v, 0.7) * Math.PI * 0.92);
            const a = pAngle + u * span;
            const r = maxR * rBoost * Math.pow(Math.sin(v * Math.PI * 0.84), 0.68);
            const ly = v * h;

            const lx = Math.cos(a) * r;
            const lz = Math.sin(a) * r;
            const wp = toWorld(cx, cy, cz, basis, lx, ly, lz);
            const col = mixColor(baseCol, tipCol, v);

            return { x: wp.x, y: wp.y, z: wp.z, r: col[0], g: col[1], b: col[2] };
          }, false, basis.up);
        }
      }

      // ==========================================
      // 4. GRANDE FLEUR ÉPANOUiE (Pivoine / Cosmos)
      // ==========================================
      function addBloom(cx, cy, cz, dir, petalCount, radius, innerCol, outerCol, centerCol) {
        const basis = basisFromDir(dir);

        // Cœur bombé
        const cR = radius * 0.25;
        addGridMesh(8, 3, (u, v) => {
          const a = u * Math.PI * 2;
          const r = v * cR;
          const ly = Math.sqrt(Math.max(0, 1 - v * v)) * cR * 0.85;
          const wp = toWorld(cx, cy, cz, basis, Math.cos(a) * r, ly, Math.sin(a) * r);
          const col = mixColor(centerCol, COLORS.champagne, (1 - v) * 0.35);
          return { x: wp.x, y: wp.y, z: wp.z, r: col[0], g: col[1], b: col[2] };
        }, true, basis.up);

        // Pétales généreux
        for (let p = 0; p < petalCount; p++) {
          const baseA = (p / petalCount) * Math.PI * 2;
          const halfSpan = (Math.PI / petalCount) * 0.92;

          addGridMesh(2, 4, (uNorm, v) => {
            const u = uNorm * 2 - 1;
            const dist = cR * 0.75 + v * (radius - cR * 0.75);
            const a = baseA + u * halfSpan * Math.pow(Math.sin(v * Math.PI), 0.65);
            const ly = Math.sin(v * Math.PI * 0.82) * radius * 0.20 - v * v * radius * 0.10;

            const wp = toWorld(cx, cy, cz, basis, Math.cos(a) * dist, ly, Math.sin(a) * dist);
            const col = mixColor(innerCol, outerCol, v);
            return { x: wp.x, y: wp.y, z: wp.z, r: col[0], g: col[1], b: col[2] };
          }, false, basis.up);
        }
      }

      // ==========================================
      // 5. FEUILLAGE ÉMERAUDE & EUCALYPTUS (100% solide)
      // ==========================================
      function addLeaf(ox, oy, oz, dir, length, width, colBase, colTip) {
        const basis = basisFromDir(dir);
        addGridMesh(2, 6, (uNorm, v) => {
          const u = uNorm * 2 - 1;
          const w = Math.sin(Math.pow(v, 0.78) * Math.PI) * width;
          const lx = u * w;
          const ly = v * length;
          const lz = -v * v * length * 0.32 + Math.abs(u) * w * 0.22;

          const wp = toWorld(ox, oy, oz, basis, lx, ly, lz);
          const col = mixColor(colBase, colTip, v);
          return { x: wp.x, y: wp.y, z: wp.z, r: col[0], g: col[1], b: col[2] };
        }, false, basis.forward);
      }

      // ==========================================
      // 6. GYPSOPHILE (petits nuages blancs délicats)
      // ==========================================
      function addBabysBreath(cx, cy, cz) {
        for (let i = 0; i < 8; i++) {
          const a = (i / 8) * Math.PI * 2;
          const r = 0.08 + (i % 3) * 0.055;
          const dy = ((i % 3) - 1) * 0.065;
          addAccentPoint(
            cx + Math.cos(a) * r,
            cy + dy,
            cz + Math.sin(a) * r,
            COLORS.whitePure,
            i % 2 === 0 ? "*" : "+"
          );
        }
      }

      // ==========================================
      // 7. PAPIER FLEURISTE MAJESTUEUX (100% OPAQUE — ZÉRO TIGE VISIBLE)
      // ==========================================
      function addWrap() {
        const yWaist = -0.86;
        const yBot = -1.72;

        // A. Cône sablier principal avec plis naturels et jupe évasée en bas
        addGridMesh(36, 18, (u, v) => {
          const a = u * Math.PI * 2;
          // Bord supérieur sculpté : légèrement plus bas devant pour que les fleurs débordent
          const frontDip = Math.max(0, Math.sin(a));
          const yTop = 0.64 - 0.24 * Math.pow(frontDip, 1.3) + 0.05 * Math.cos(a * 4);
          // Bord inférieur légèrement ondulé façon papier froissé
          const yBotLocal = yBot + 0.045 * Math.sin(a * 5);

          const y = yBotLocal + v * (yTop - yBotLocal);

          let radius;
          if (y >= yWaist) {
            const k = (y - yWaist) / (yTop - yWaist);
            radius = 0.24 + Math.pow(k, 1.08) * 0.98;
          } else {
            const k = (yWaist - y) / (yWaist - yBotLocal);
            radius = 0.24 + Math.pow(k, 0.88) * 0.34;
          }

          // Plis souples du papier fleuriste
          const pleatAmp = y > yWaist ? 0.055 * ((y - yWaist) / (yTop - yWaist)) : 0.042;
          const pleat = Math.sin(a * 7 + y * 0.9) * pleatAmp;
          const r = radius + pleat;

          const x = Math.cos(a) * r;
          const z = Math.sin(a) * r;

          let col = mixColor(COLORS.wrapShadow, COLORS.wrapPearl, 0.45 + 0.55 * (Math.sin(a) * 0.5 + 0.5));
          if (y < yWaist) col = mixColor(col, COLORS.wrapSoft, 0.35);

          return { x, y, z, r: col[0], g: col[1], b: col[2] };
        }, true);

        // B. Fermeture propre sous la jupe du papier (aspect fini même si on penche le bouquet)
        addGridMesh(18, 3, (u, v) => {
          const a = u * Math.PI * 2;
          const r = v * 0.54;
          const y = yBot + 0.08 * (1 - v) + 0.03 * Math.sin(a * 5) * v;
          const col = mixColor(COLORS.wrapInner, COLORS.wrapShadow, v);
          return { x: Math.cos(a) * r, y, z: Math.sin(a) * r, r: col[0], g: col[1], b: col[2] };
        }, true, [0, -1, 0]);

        // C. Grand éventail architectural de 5 feuilles de papier plié montant derrière le bouquet
        const sheets = [
          // [angleCentre, demiLargeurAngulaire, hauteurMax, rayonBase, decalageZ]
          [-Math.PI * 0.50, 0.56, 2.12, 1.18, 0.26], // Grande feuille centrale haute (couronne)
          [-Math.PI * 0.74, 0.50, 1.88, 1.16, 0.22], // Aile arrière gauche
          [-Math.PI * 0.26, 0.50, 1.88, 1.16, 0.22], // Aile arrière droite
          [-Math.PI * 0.96, 0.42, 1.48, 1.18, 0.16], // Pan latéral gauche
          [-Math.PI * 0.04, 0.42, 1.48, 1.18, 0.16]  // Pan latéral droit
        ];

        for (const [cAng, halfSpan, hTop, rBase, flareOut] of sheets) {
          addGridMesh(8, 8, (uNorm, v) => {
            const u = uNorm * 2 - 1; // -1 à 1
            const span = halfSpan * (0.92 - v * 0.16);
            const a = cAng + u * span;
            // Sommet en arche douce façon origami fleuriste
            const peak = (1 - u * u) * 0.22 * v;
            const y = 0.28 + v * (hTop - 0.28) + peak;
            // Léger repli vers l'extérieur en haut
            const fold = (1 - u * u) * 0.12 + Math.pow(v, 1.5) * flareOut;
            const r = rBase + fold;

            const x = Math.cos(a) * r;
            const z = Math.sin(a) * r;
            const col = mixColor(COLORS.wrapShadow, COLORS.wrapPearl, 0.25 + v * 0.75);

            return { x, y, z, r: col[0], g: col[1], b: col[2] };
          }, false);
        }
      }

      // ==========================================
      // 8. RUBAN SATIN & GRAND NŒUD 3D SCULPTÉ
      // ==========================================
      function addRibbon() {
        const yWaist = -0.86;
        const rWaist = 0.29;

        // Bandeau autour de la taille
        addGridMesh(28, 3, (u, v) => {
          const a = u * Math.PI * 2;
          const y = yWaist + (v - 0.5) * 0.18;
          const col = mixColor(COLORS.ribbonDeep, COLORS.ribbonMain, 0.5 + 0.5 * Math.sin(v * Math.PI));
          return { x: Math.cos(a) * rWaist, y, z: Math.sin(a) * rWaist, r: col[0], g: col[1], b: col[2] };
        }, true);

        // Nœud central bombé
        addGridMesh(8, 5, (u, v) => {
          const a = u * Math.PI * 2;
          const phi = (v - 0.5) * Math.PI;
          const x = Math.cos(a) * Math.cos(phi) * 0.11;
          const y = yWaist + Math.sin(phi) * 0.11;
          const z = rWaist + 0.08 + Math.sin(a) * Math.cos(phi) * 0.08;
          return { x, y, z, r: COLORS.ribbonMain[0], g: COLORS.ribbonMain[1], b: COLORS.ribbonMain[2] };
        }, true);

        // Deux grandes boucles de ruban en 3D devant
        for (const side of [-1, 1]) {
          addGridMesh(12, 4, (u, v) => {
            const t = u * Math.PI * 2;
            const w = (v - 0.5) * 0.16;
            const loopX = side * (0.08 + (0.5 - 0.5 * Math.cos(t)) * 0.44);
            const loopY = yWaist + Math.sin(t) * 0.16 + w * 0.72;
            const loopZ = rWaist + 0.08 + Math.sin(t * 0.5) * 0.14 + Math.cos(t) * 0.04;
            const col = mixColor(COLORS.ribbonDeep, COLORS.ribbonMain, 0.4 + 0.6 * Math.sin(v * Math.PI));
            return { x: loopX, y: loopY, z: loopZ, r: col[0], g: col[1], b: col[2] };
          }, true);

          // Deux longs pans fluides qui retombent sur la jupe de papier
          addGridMesh(3, 12, (uNorm, v) => {
            const u = uNorm * 2 - 1;
            const width = 0.068 + v * 0.032;
            const cx = side * (0.06 + v * 0.34 + Math.sin(v * Math.PI) * 0.06);
            const cy = yWaist - 0.05 - v * 0.78;
            const cz = rWaist + 0.08 + v * 0.34 + Math.sin(v * Math.PI * 1.3) * 0.07;

            const x = cx + u * width;
            const y = cy;
            const z = cz + Math.abs(u) * 0.015;
            const col = mixColor(COLORS.ribbonMain, COLORS.ribbonDeep, v * 0.45);
            return { x, y, z, r: col[0], g: col[1], b: col[2] };
          }, false);
        }
      }

      // ==========================================
      // ASSEMBLAGE DU BOUQUET MAJESTUEUX
      // ==========================================
      function buildBouquet() {
        // 1. CINQ GRANDS LYS MAJESTUEUX (couronne haute + flancs élancés)
        const lilySpecs = [
          // [x, y, z, dir, scale, bladeCol, tipCol]
          [ 0.00,  1.66,  0.14, [ 0.00,  0.96,  0.32], 1.18, COLORS.lilyWhite, COLORS.lilyBlush],  // Grand lys roi au sommet
          [-1.08,  1.28,  0.16, [-0.66,  0.76,  0.34], 1.08, COLORS.lilyWhite, COLORS.lilyBlush],  // Grand lys gauche
          [ 1.10,  1.24,  0.14, [ 0.68,  0.74,  0.32], 1.08, COLORS.lilyWhite, COLORS.lilyBlush],  // Grand lys droit
          [-0.58,  1.42, -0.58, [-0.36,  0.84, -0.46], 1.00, COLORS.lilyBlush, COLORS.lilyWhite],  // Lys rosé arrière gauche
          [ 0.62,  1.40, -0.56, [ 0.38,  0.84, -0.44], 1.00, COLORS.lilyBlush, COLORS.lilyWhite]   // Lys rosé arrière droit
        ];
        for (const [x, y, z, dir, sc, bCol, tCol] of lilySpecs) {
          addLily(x, y, z, dir, sc, bCol, tCol);
        }

        // 2. ROSES VELOURS 3D (cœur riche et romantique)
        const roseSpecs = [
          // [x, y, z, dir, radius, innerCol, outerCol]
          [ 0.00,  0.92,  0.72, [ 0.00,  0.54,  0.88], 0.56, COLORS.crimsonDeep, COLORS.crimson],   // Grande rose rouge devant centre
          [-0.64,  0.82,  0.66, [-0.40,  0.52,  0.82], 0.50, COLORS.rosePink,    COLORS.blushPink], // Rose poudrée avant gauche
          [ 0.66,  0.80,  0.64, [ 0.42,  0.50,  0.82], 0.50, COLORS.crimsonDeep, COLORS.crimson],   // Rose rouge avant droite
          [-0.48,  1.34,  0.22, [-0.26,  0.88,  0.38], 0.48, COLORS.crimsonDeep, COLORS.crimson],   // Rose haute gauche
          [ 0.50,  1.32,  0.22, [ 0.28,  0.88,  0.38], 0.48, COLORS.rosePink,    COLORS.blushPink], // Rose haute droite
          [ 0.00,  1.24, -0.68, [ 0.00,  0.78, -0.64], 0.52, COLORS.crimsonDeep, COLORS.crimson]    // Rose arrière centre
        ];
        for (const [x, y, z, dir, r, inner, outer] of roseSpecs) {
          addRose(x, y, z, dir, r, inner, outer);
        }

        // 3. GRANDES FLEURS ÉPANOUiES (volume harmonieux lilas / blush / champagne)
        const bloomSpecs = [
          // [x, y, z, dir, petals, radius, innerCol, outerCol, centerCol]
          [-1.32,  0.66,  0.08, [-0.88,  0.46,  0.26], 10, 0.58, COLORS.lilacSoft,  COLORS.blushPink, COLORS.goldCenter],
          [ 1.32,  0.64,  0.06, [ 0.88,  0.46,  0.24], 10, 0.58, COLORS.champagne,  COLORS.lilyWhite, COLORS.goldCenter],
          [-0.98,  0.54,  0.62, [-0.64,  0.36,  0.74], 10, 0.52, COLORS.rosePink,   COLORS.blushPink, COLORS.goldCenter],
          [ 1.00,  0.52,  0.60, [ 0.64,  0.36,  0.74], 10, 0.52, COLORS.lilacSoft,  COLORS.lilyBlush, COLORS.goldCenter],
          [ 0.00,  0.46,  0.96, [ 0.00,  0.28,  0.96], 10, 0.50, COLORS.champagne,  COLORS.blushPink, COLORS.goldCenter],
          [-0.96,  0.84, -0.58, [-0.64,  0.64, -0.56], 10, 0.54, COLORS.rosePink,   COLORS.blushPink, COLORS.goldCenter],
          [ 0.98,  0.84, -0.56, [ 0.64,  0.64, -0.56], 10, 0.54, COLORS.champagne,  COLORS.lilyWhite, COLORS.goldCenter]
        ];
        for (const [x, y, z, dir, p, r, iCol, oCol, cCol] of bloomSpecs) {
          addBloom(x, y, z, dir, p, r, iCol, oCol, cCol);
        }

        // 4. TULIPES ÉLANCÉES (accentuent la verticalité majestueuse)
        const tulipSpecs = [
          [-0.38,  1.58, -0.14, [-0.20,  0.98,  0.06], 1.12, COLORS.crimsonDeep, COLORS.rosePink],
          [ 0.40,  1.56, -0.14, [ 0.20,  0.98,  0.06], 1.12, COLORS.blushPink,   COLORS.lilyWhite],
          [-0.94,  1.06,  0.42, [-0.58,  0.74,  0.44], 1.00, COLORS.crimsonDeep, COLORS.crimson],
          [ 0.96,  1.04,  0.40, [ 0.58,  0.74,  0.44], 1.00, COLORS.rosePink,    COLORS.blushPink]
        ];
        for (const [x, y, z, dir, sc, bCol, tCol] of tulipSpecs) {
          addTulip(x, y, z, dir, sc, bCol, tCol);
        }

        // 5. FEUILLAGE ÉMERAUDE EN COURONNE (encadre les fleurs sans aucune tige qui traverse le papier)
        const leafCount = 20;
        for (let i = 0; i < leafCount; i++) {
          const a = (i / leafCount) * Math.PI * 2 + 0.14;
          const elev = 0.24 + (i % 3) * 0.16;
          const dir = [Math.cos(a) * 0.94, elev, Math.sin(a) * 0.94];
          addLeaf(
            Math.cos(a) * 0.68, 0.42, Math.sin(a) * 0.68,
            dir,
            1.14 + (i % 3) * 0.16,
            0.26,
            i % 2 === 0 ? COLORS.leafDark : COLORS.leafMid,
            i % 2 === 0 ? COLORS.leafMid : COLORS.leafLight
          );
        }

        // 6. GYPSOPHILE DÉLICAT ENTRE LES FLEURS
        const babyCoords = [
          [-0.78, 1.50, 0.30], [ 0.80, 1.48, 0.28],
          [-0.28, 1.24, 0.68], [ 0.30, 1.22, 0.66],
          [-1.24, 0.96, 0.36], [ 1.26, 0.94, 0.34],
          [-0.44, 0.62, 0.88], [ 0.46, 0.60, 0.86],
          [-0.42, 1.38, -0.58], [ 0.44, 1.36, -0.56]
        ];
        for (const [bx, by, bz] of babyCoords) {
          addBabysBreath(bx, by, bz);
        }

        // 7. PAPIER OPAQUE + RUBAN SATIN
        addWrap();
        addRibbon();
      }

      buildBouquet();

      // Conversion en tableaux typés pour des performances maximales (60 FPS partout)
      const vertCount = mX.length;
      const vX  = Float32Array.from(mX);
      const vY  = Float32Array.from(mY);
      const vZ  = Float32Array.from(mZ);
      const vNX = Float32Array.from(mNX);
      const vNY = Float32Array.from(mNY);
      const vNZ = Float32Array.from(mNZ);
      const vR  = Uint8Array.from(mR);
      const vG  = Uint8Array.from(mG);
      const vB  = Uint8Array.from(mB);

      const triCount = mTriA.length;
      const triA = Uint32Array.from(mTriA);
      const triB = Uint32Array.from(mTriB);
      const triC = Uint32Array.from(mTriC);

      const svX   = new Float32Array(vertCount);
      const svY   = new Float32Array(vertCount);
      const svZ   = new Float32Array(vertCount);
      const svLum = new Float32Array(vertCount);

      const accentCount = ptX.length;
      const aX  = Float32Array.from(ptX);
      const aY  = Float32Array.from(ptY);
      const aZ  = Float32Array.from(ptZ);
      const aR  = Uint8Array.from(ptR);
      const aG  = Uint8Array.from(ptG);
      const aB  = Uint8Array.from(ptB);
      const aCh = Uint8Array.from(ptCh);

      // 46 particules flottantes harmonieuses autour du bouquet
      const sparkleColors = [COLORS.blushPink, COLORS.champagne, COLORS.lilyWhite, COLORS.lilacSoft];
      const sparkleChars  = ["*", "+", ".", "*"];
      const sparkles = Array.from({ length: 46 }, (_, i) => ({
        angle: (i / 46) * Math.PI * 2 + (i % 5) * 0.21,
        radius: 1.92 + ((i * 37) % 100) / 95,
        yBase: -1.55 + ((i * 53) % 100) / 100 * 3.75,
        speed: 0.34 + ((i * 29) % 100) / 180,
        phase: (i * 1.73) % (Math.PI * 2),
        ch: sparkleChars[i % sparkleChars.length].charCodeAt(0),
        color: sparkleColors[i % sparkleColors.length]
      }));

      // ==========================================
      // Caméra & Contrôles (Souris + Trackpad + Tactile)
      // ==========================================
      let yaw = 0;
      let pitch = 0.12;
      let zoom = 1.0;

      let velYaw = 0;
      let velPitch = 0;
      const AUTO_SPIN_SPEED = -0.0068;

      const activePointers = new Map();
      let isDragging = false;
      let lastX = 0;
      let lastY = 0;
      let lastPinchDist = 0;
      let lastTapTime = 0;

      canvas.addEventListener("pointerdown", (e) => {
        canvas.setPointerCapture(e.pointerId);
        activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

        // Double-tap / double-clic pour recentrer
        const now = performance.now();
        if (activePointers.size === 1 && now - lastTapTime < 280) {
          pitch = 0.12;
          zoom = 1.0;
          velYaw = 0;
          velPitch = 0;
        }
        lastTapTime = now;

        if (activePointers.size === 1) {
          isDragging = true;
          lastX = e.clientX;
          lastY = e.clientY;
        } else if (activePointers.size === 2) {
          isDragging = false;
          const pts = [...activePointers.values()];
          lastPinchDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
        }
      });

      canvas.addEventListener("pointermove", (e) => {
        if (!activePointers.has(e.pointerId)) return;
        activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

        if (activePointers.size === 1 && isDragging) {
          const dx = e.clientX - lastX;
          const dy = e.clientY - lastY;
          lastX = e.clientX;
          lastY = e.clientY;

          // Sens naturel : glisser à gauche fait tourner le bouquet vers la gauche
          velYaw = -dx * 0.009;
          velPitch = dy * 0.007;
          yaw += velYaw;
          pitch = Math.max(-0.95, Math.min(1.05, pitch + velPitch));
        } else if (activePointers.size === 2) {
          const pts = [...activePointers.values()];
          const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
          if (lastPinchDist > 0) {
            zoom = Math.max(0.55, Math.min(2.2, zoom * (dist / lastPinchDist)));
          }
          lastPinchDist = dist;
        }
      });

      function endPointer(e) {
        activePointers.delete(e.pointerId);
        if (activePointers.size === 1) {
          const [pt] = activePointers.values();
          isDragging = true;
          lastX = pt.x;
          lastY = pt.y;
        } else if (activePointers.size === 0) {
          isDragging = false;
          lastPinchDist = 0;
        }
      }

      canvas.addEventListener("pointerup", endPointer);
      canvas.addEventListener("pointercancel", endPointer);

      canvas.addEventListener("wheel", (e) => {
        e.preventDefault();
        const factor = e.deltaY > 0 ? 0.92 : 1.08;
        zoom = Math.max(0.55, Math.min(2.2, zoom * factor));
      }, { passive: false });

      // ==========================================
      // Grille ASCII & Buffers pré-alloués (zéro GC)
      // ==========================================
      let cols = 0;
      let rows = 0;
      let charW = 8;
      let charH = 14;
      let fontSize = 13;
      let zBuf  = new Float32Array(0);
      let chBuf = new Uint8Array(0);
      let rBuf  = new Uint8Array(0);
      let gBuf  = new Uint8Array(0);
      let bBuf  = new Uint8Array(0);

      function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const w = window.innerWidth;
        const h = window.innerHeight;

        canvas.width = Math.floor(w * dpr);
        canvas.height = Math.floor(h * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        const minDim = Math.min(w, h);
        fontSize = Math.max(8, Math.min(14, Math.floor(minDim / 58)));
        ctx.font = `bold ${fontSize}px "JetBrains Mono", "Fira Code", Consolas, monospace`;
        ctx.textBaseline = "top";

        charW = ctx.measureText("M").width;
        charH = Math.ceil(fontSize * 1.12);

        cols = Math.max(30, Math.floor(w / charW));
        rows = Math.max(24, Math.floor(h / charH));

        const size = cols * rows;
        zBuf  = new Float32Array(size);
        chBuf = new Uint8Array(size);
        rBuf  = new Uint8Array(size);
        gBuf  = new Uint8Array(size);
        bBuf  = new Uint8Array(size);
      }

      window.addEventListener("resize", resize);
      resize();

      // ==========================================
      // Boucle de rendu 3D (Rasterizer ASCII + Particules)
      // ==========================================
      const lightDir = normalize([0.42, 0.72, 0.88]);
      const rimDir   = normalize([-0.55, 0.45, -0.65]);

      function render(time) {
        requestAnimationFrame(render);

        if (!isDragging) {
          yaw += AUTO_SPIN_SPEED + velYaw;
          pitch = Math.max(-0.95, Math.min(1.05, pitch + velPitch));
          velYaw *= 0.92;
          velPitch *= 0.92;
        }

        zBuf.fill(-1e9);
        chBuf.fill(0);

        const cosY = Math.cos(yaw);
        const sinY = Math.sin(yaw);
        const cosX = Math.cos(pitch);
        const sinX = Math.sin(pitch);

        const usableRows = rows - 4;
        const centerCol = cols * 0.5;
        const centerRow = usableRows * 0.52;

        // Mise à l'échelle généreuse (rendu imposant sur mobile, iPad et PC)
        const charAspect = charH / charW;
        const scaleY = Math.min(usableRows * 0.215, (cols / charAspect) * 0.245) * zoom;
        const scaleX = scaleY * charAspect;
        const camDist = 7.2;

        // 1. Transformation de tous les sommets du maillage 3D
        for (let i = 0; i < vertCount; i++) {
          const px = vX[i];
          const py = vY[i] - 0.18; // Centrage vertical du bouquet
          const pz = vZ[i];

          const x1 = px * cosY - pz * sinY;
          const z1 = px * sinY + pz * cosY;
          const y2 = py * cosX - z1 * sinX;
          const z2 = py * sinX + z1 * cosX;

          const invZ = camDist / (camDist - z2);
          svX[i] = centerCol + x1 * scaleX * invZ;
          svY[i] = centerRow - y2 * scaleY * invZ;
          svZ[i] = z2;

          // Éclairage 3D double-face (pour papier, pétales et feuilles) + lumière de contour
          const nx = vNX[i], ny = vNY[i], nz = vNZ[i];
          const nx1 = nx * cosY - nz * sinY;
          const nz1 = nx * sinY + nz * cosY;
          const ny2 = ny * cosX - nz1 * sinX;
          const nz2 = ny * sinX + nz1 * cosX;

          const dMain = nx1 * lightDir[0] + ny2 * lightDir[1] + nz2 * lightDir[2];
          const dRim  = nx1 * rimDir[0]   + ny2 * rimDir[1]   + nz2 * rimDir[2];
          const key   = dMain >= 0 ? dMain : -dMain * 0.62;
          const rim   = Math.max(0, Math.abs(dRim)) * 0.22;
          svLum[i] = Math.max(0.20, Math.min(1.0, 0.28 + key * 0.68 + rim));
        }

        // 2. Rasterisation des triangles directement dans la grille ASCII (100% opaque)
        const rampLen = RAMP_CODES.length;
        for (let t = 0; t < triCount; t++) {
          const i0 = triA[t];
          const i1 = triB[t];
          const i2 = triC[t];

          const x0 = svX[i0], y0 = svY[i0], z0 = svZ[i0];
          const x1 = svX[i1], y1 = svY[i1], z1 = svZ[i1];
          const x2 = svX[i2], y2 = svY[i2], z2 = svZ[i2];

          const area = (x1 - x0) * (y2 - y0) - (x2 - x0) * (y1 - y0);
          if (area > -1e-4 && area < 1e-4) continue;

          let minX = Math.floor(Math.min(x0, x1, x2));
          let maxX = Math.ceil(Math.max(x0, x1, x2));
          let minY = Math.floor(Math.min(y0, y1, y2));
          let maxY = Math.ceil(Math.max(y0, y1, y2));

          if (maxX < 0 || minX >= cols || maxY < 0 || minY >= usableRows) continue;
          if (minX < 0) minX = 0;
          if (maxX >= cols) maxX = cols - 1;
          if (minY < 0) minY = 0;
          if (maxY >= usableRows) maxY = usableRows - 1;

          const invArea = 1 / area;
          const l0 = svLum[i0], l1 = svLum[i1], l2 = svLum[i2];
          const r0 = vR[i0], r1 = vR[i1], r2 = vR[i2];
          const g0 = vG[i0], g1 = vG[i1], g2 = vG[i2];
          const b0 = vB[i0], b1 = vB[i1], b2 = vB[i2];

          for (let py = minY; py <= maxY; py++) {
            const sy = py + 0.5;
            const rowOff = py * cols;
            for (let px = minX; px <= maxX; px++) {
              const sx = px + 0.5;
              const w0 = ((x1 - sx) * (y2 - sy) - (x2 - sx) * (y1 - sy)) * invArea;
              if (w0 < -0.025) continue;
              const w1 = ((x2 - sx) * (y0 - sy) - (x0 - sx) * (y2 - sy)) * invArea;
              if (w1 < -0.025) continue;
              const w2 = 1 - w0 - w1;
              if (w2 < -0.025) continue;

              const z = w0 * z0 + w1 * z1 + w2 * z2;
              const idx = rowOff + px;
              if (z > zBuf[idx]) {
                zBuf[idx] = z;
                const lum = w0 * l0 + w1 * l1 + w2 * l2;
                const rIdx = Math.min(rampLen - 1, Math.max(1, (lum * rampLen) | 0));
                chBuf[idx] = RAMP_CODES[rIdx];

                const shade = 0.48 + lum * 0.58;
                const cr = (w0 * r0 + w1 * r1 + w2 * r2) * shade;
                const cg = (w0 * g0 + w1 * g1 + w2 * g2) * shade;
                const cb = (w0 * b0 + w1 * b1 + w2 * b2) * shade;
                rBuf[idx] = cr > 255 ? 255 : cr | 0;
                gBuf[idx] = cg > 255 ? 255 : cg | 0;
                bBuf[idx] = cb > 255 ? 255 : cb | 0;
              }
            }
          }
        }

        // 3. Points d'accent (étamines des lys & gypsophile blanc)
        for (let i = 0; i < accentCount; i++) {
          const px = aX[i];
          const py = aY[i] - 0.18;
          const pz = aZ[i];

          const x1 = px * cosY - pz * sinY;
          const z1 = px * sinY + pz * cosY;
          const y2 = py * cosX - z1 * sinX;
          const z2 = py * sinX + z1 * cosX;

          const invZ = camDist / (camDist - z2);
          const sx = (centerCol + x1 * scaleX * invZ) | 0;
          const sy = (centerRow - y2 * scaleY * invZ) | 0;

          if (sx >= 0 && sx < cols && sy >= 0 && sy < usableRows) {
            const idx = sy * cols + sx;
            if (z2 + 0.05 > zBuf[idx]) {
              zBuf[idx] = z2 + 0.05;
              chBuf[idx] = aCh[i];
              rBuf[idx] = aR[i];
              gBuf[idx] = aG[i];
              bBuf[idx] = aB[i];
            }
          }
        }

        // 4. Particules flottantes scintillantes autour du bouquet
        const tSec = time * 0.001;
        for (let i = 0; i < sparkles.length; i++) {
          const sp = sparkles[i];
          const a = sp.angle + tSec * 0.22 * sp.speed;
          const px = Math.cos(a) * sp.radius;
          const pz = Math.sin(a) * sp.radius;
          const py = sp.yBase + Math.sin(tSec * sp.speed + sp.phase) * 0.24 - 0.18;

          const x1 = px * cosY - pz * sinY;
          const z1 = px * sinY + pz * cosY;
          const y2 = py * cosX - z1 * sinX;
          const z2 = py * sinX + z1 * cosX;

          const invZ = camDist / (camDist - z2);
          const sx = (centerCol + x1 * scaleX * invZ) | 0;
          const sy = (centerRow - y2 * scaleY * invZ) | 0;

          if (sx >= 0 && sx < cols && sy >= 0 && sy < usableRows) {
            const idx = sy * cols + sx;
            if (z2 > zBuf[idx]) {
              const twinkle = 0.42 + 0.58 * Math.sin(tSec * 2.8 + sp.phase);
              if (twinkle > 0.34) {
                zBuf[idx] = z2;
                chBuf[idx] = sp.ch;
                rBuf[idx] = (sp.color[0] * twinkle) | 0;
                gBuf[idx] = (sp.color[1] * twinkle) | 0;
                bBuf[idx] = (sp.color[2] * twinkle) | 0;
              }
            }
          }
        }

        // 5. Dessin final sur fond noir pur
        ctx.fillStyle = "#000000";
        ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

        ctx.font = `bold ${fontSize}px "JetBrains Mono", "Fira Code", Consolas, monospace`;
        const offsetX = (window.innerWidth - cols * charW) * 0.5;
        const offsetY = (window.innerHeight - rows * charH) * 0.5;

        for (let y = 0; y < usableRows; y++) {
          const rowOff = y * cols;
          const py = offsetY + y * charH;
          for (let x = 0; x < cols; x++) {
            const idx = rowOff + x;
            const code = chBuf[idx];
            if (code !== 0) {
              ctx.fillStyle = `rgb(${rBuf[idx]},${gBuf[idx]},${bBuf[idx]})`;
              ctx.fillText(String.fromCharCode(code), offsetX + x * charW, py);
            }
          }
        }

        // 6. Texte ASCII en bas ("I love you sweetheart <3")
        const msgFontSize = Math.max(12, Math.min(20, Math.floor(window.innerWidth / (MESSAGE.length * 0.72))));
        ctx.font = `bold ${msgFontSize}px "JetBrains Mono", "Fira Code", Consolas, monospace`;
        const pulse = 0.86 + 0.14 * Math.sin(tSec * 2.2);
        ctx.fillStyle = `rgb(${(255 * pulse) | 0},${(135 * pulse) | 0},${(188 * pulse) | 0})`;

        const textWidth = ctx.measureText(MESSAGE).width;
        const textX = (window.innerWidth - textWidth) * 0.5;
        const textY = window.innerHeight - msgFontSize * 2.1;
        ctx.fillText(MESSAGE, textX, textY);
      }

      requestAnimationFrame(render);
    })();
  </script>
</body>
</html>
